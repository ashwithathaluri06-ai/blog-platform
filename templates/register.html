{% extends "base.html" %}

{% block title %}Register | BlogSpace{% endblock %}

{% block content %}
<section class="form-wrapper">
    <div class="form-card">
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create an account</h1>
        <p class="form-description">Create your account and publish your first story.</p>

        <form method="POST" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Choose a username" maxlength="80" required>

            <label for="email">Email address</label>
            <input type="email" id="email" name="email"
                   placeholder="you@example.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="At least 8 characters" minlength="8" required>

            <button type="submit" class="button full-button">Create Account</button>
        </form>

        <p class="form-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</section>
{% endblock %}
