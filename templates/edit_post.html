{% extends "base.html" %}

{% block title %}Edit Story | BlogSpace{% endblock %}

{% block content %}
<section class="form-wrapper">
    <div class="form-card post-form-card">
        <p class="eyebrow">MAKE IT BETTER</p>
        <h1>Edit your story</h1>
        <p class="form-description">Update your title or make changes to your content.</p>

        <form method="POST" action="{{ url_for('edit_post', post_id=post.id) }}">
            <label for="title">Post title</label>
            <input type="text" id="title" name="title"
                   value="{{ post.title }}" maxlength="200" required>

            <label for="content">Your story</label>
            <textarea id="content" name="content" rows="12" required>{{ post.content }}</textarea>

            <button type="submit" class="button full-button">Save Changes</button>
            <a class="cancel-link" href="{{ url_for('post_detail', post_id=post.id) }}">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
